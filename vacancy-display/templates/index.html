
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Vacancy Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #222;
        }

        .dashboard {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background: white;
            padding: 30px;
            width: 180px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ccc;
        }

        .number {
            font-size: 40px;
            font-weight: bold;
        }

        .vacant { color: green; }
        .occupied { color: red; }

        #updated {
            margin-top: 25px;
            color: #555;
        }
    </style>
</head>

<body>
    <h1>Vehicle Parking System</h1>
    <h2>Real-Time Parking Vacancy Display</h2>

    <div class="dashboard">
        <div class="card">
            <h3>Total Slots</h3>
            <div class="number" id="total">0</div>
        </div>

        <div class="card">
            <h3>Vacant Slots</h3>
            <div class="number vacant" id="vacant">0</div>
        </div>

        <div class="card">
            <h3>Occupied Slots</h3>
            <div class="number occupied" id="occupied">0</div>
        </div>
    </div>

    <p id="updated">Waiting for data...</p>

    <script>
        async function updateDashboard() {
            try {
                const response = await fetch("/api/vacancy");
                const data = await response.json();

                document.getElementById("total").textContent =
                    data.total_slots;

                document.getElementById("vacant").textContent =
                    data.vacant_slots;

                document.getElementById("occupied").textContent =
                    data.occupied_slots;

                document.getElementById("updated").textContent =
                    "Last updated: " + new Date().toLocaleTimeString();
            } catch (error) {
                document.getElementById("updated").textContent =
                    "Unable to fetch parking data";
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 1000);
    </script>
</body>
</html>
