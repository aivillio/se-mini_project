name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job writes a table to its run Summary page (scripts/ci_summary.py); the last job collects them.
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff check
        id: ruff
        run: |
          set +e
          ruff check . --output-format=concise | tee ruff.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Job summary
        if: always()
        run: python scripts/ci_summary.py lint ruff.txt "${{ steps.ruff.outputs.code }}"
      - name: Fail on lint errors
        if: steps.ruff.outputs.code != '0'
        run: exit 1

  frontend:
    name: Frontend checks (JS syntax, page links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check web/ pages and scripts
        run: python scripts/ci_summary.py frontend

  security:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - name: Static analysis of vps/ (bandit)
        run: bandit -q -r vps -f json -o bandit.json || true
      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt -f json -o pip-audit.json || true
      - name: Job summary (fails on medium/high findings)
        run: python scripts/ci_summary.py security bandit.json pip-audit.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: security-reports
          path: |
            bandit.json
            pip-audit.json

  codeql:
    name: CodeQL security analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  test:
    name: Unit + system tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests with branch coverage
        run: >
          pytest tests --ignore=tests/perf
          --cov=vps --cov-branch --cov-report=term --cov-report=xml --cov-report=html
          --junitxml=junit.xml --html=test-report.html --self-contained-html
          --cov-fail-under=90
      - name: Job summary
        if: always()
        run: python scripts/ci_summary.py tests junit.xml coverage.xml ${{ matrix.python }}
      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-py${{ matrix.python }}
          path: |
            junit.xml
            test-report.html
            coverage.xml
            htmlcov/

  performance:
    name: Performance & scalability (NF-001 / NF-003)
    runs-on: ubuntu-latest
    needs: test
    # shared CI runners have noisy neighbours: results are published but do not block merges
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Performance suite
        run: pytest tests/perf -v
        env:
          VPS_PERF_OUT: perf-metrics.json
      - name: Job summary
        if: always()
        run: python scripts/ci_summary.py perf perf-metrics.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: perf-metrics
          path: perf-metrics.json

  summary:
    name: Pipeline summary
    runs-on: ubuntu-latest
    needs: [lint, frontend, security, codeql, test, performance]
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Pipeline summary
        env:
          JOB_LINT: ${{ needs.lint.result }}
          JOB_FRONTEND: ${{ needs.frontend.result }}
          JOB_SECURITY: ${{ needs.security.result }}
          JOB_CODEQL: ${{ needs.codeql.result }}
          JOB_TESTS: ${{ needs.test.result }}
          JOB_PERFORMANCE: ${{ needs.performance.result }}
        run: python scripts/ci_summary.py pipeline artifacts
      - name: Fail if a required stage failed
        if: >
          needs.lint.result != 'success' || needs.frontend.result != 'success' ||
          needs.security.result != 'success' || needs.codeql.result != 'success' || needs.test.result != 'success'
        run: exit 1
