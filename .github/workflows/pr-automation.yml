name: PR automation

# Labels PRs by the area they touch, assigns the author, checks the PR links a backlog story,
# and (optionally) adds the PR to the GitHub Project board.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Label by changed paths
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml

      - name: Assign the PR author
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr.assignees || pr.assignees.length === 0) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, assignees: [pr.user.login],
              });
            }

      - name: Require a backlog story reference
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const text = `${pr.title}\n${pr.body || ""}`;
            if (!/VPS-(F|NF|SR)-\d{3}/.test(text) && !/#\d+/.test(text)) {
              core.setFailed("Link the backlog item: put 'Closes #<issue>' or the requirement ID (e.g. VPS-F-005) in the PR body.");
            }

  add-to-project:
    runs-on: ubuntu-latest
    if: ${{ vars.PROJECT_URL != '' }}
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_TOKEN }}
